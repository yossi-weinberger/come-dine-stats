name: Refresh show data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-import.yml'

permissions:
  contents: write

concurrency:
  group: data-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Recover legacy API from Wayback
        continue-on-error: true
        shell: bash
        run: |
          npm run recover:legacy
          if [ -s data/raw/legacy/contestants.json ]; then
            npm run normalize
          else
            echo "No legacy contestants snapshot recovered in this run"
          fi

      - name: Import Fandom
        run: npm run import:fandom

      - name: Import Kan metadata
        run: npm run import:kan

      - name: Merge sources
        run: npm run merge

      - name: Generate coverage report
        run: npm run coverage

      - name: Print stats
        run: npm run stats

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "come-dine-stats bot"
          git config user.email "137178593+yossi-weinberger@users.noreply.github.com"

          for path in \
            data/raw/fandom/coverage.json \
            data/raw/legacy \
            data/normalized/fandom-contestants.json \
            data/normalized/legacy-contestants.json \
            data/normalized/kan-episodes.json \
            data/normalized/contestants.json \
            data/reports/conflicts.json \
            data/reports/coverage.json
          do
            if [ -e "$path" ]; then git add "$path"; fi
          done

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "refresh imported show data"
          git push
