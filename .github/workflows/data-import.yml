name: Refresh show data

# Generated data intentionally excludes volatile retrieval timestamps, so an
# unchanged source refresh should finish with "No data changes".
on:
  workflow_dispatch:
  schedule:
    # Daily while season 10 is actively airing; return to weekly after the finale.
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-import.yml'
      - 'scripts/import-fandom.ts'
      - 'scripts/import-wikipedia.ts'
      - 'scripts/import-season10.ts'
      - 'scripts/import-kan.ts'
      - 'scripts/import-kan-recipes.ts'
      - 'scripts/enrich-kan-cities.ts'
      - 'scripts/import-supplemental-menus.ts'
      - 'scripts/import-supplemental-profiles.ts'
      - 'scripts/merge.ts'
      - 'scripts/coverage.ts'
      - 'scripts/menu-gaps.ts'
      - 'scripts/data-health.ts'
      - 'scripts/check-competition-rules.ts'
      - 'scripts/check-stats-engine.ts'
      - 'scripts/check-season10-profile-parser.ts'
      - 'scripts/stats.ts'
      - 'lib/competition.ts'
      - 'lib/stats-engine.ts'
      - 'lib/season10-profile-parser.ts'
      - 'scripts/update-readme-stats.ts'
      - 'data/wikipedia-season-pages.json'
      - 'data/kan-season-pages.json'
      - 'data/supplemental/menus*.json'
      - 'data/supplemental/profiles*.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: data-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Import Fandom
        run: npm run import:fandom

      - name: Import Hebrew Wikipedia historical seasons
        run: npm run import:wikipedia

      - name: Import rolling season 10
        run: npm run import:season10

      - name: Import Kan metadata
        run: npm run import:kan

      - name: Enrich missing cities from Kan
        run: npm run enrich:kan-cities

      - name: Enrich menus from official Kan recipes
        run: npm run import:kan-recipes

      - name: Import verified supplemental menus
        run: npm run import:supplemental-menus

      - name: Import verified supplemental profiles
        run: npm run import:supplemental-profiles

      - name: Merge sources
        run: npm run merge

      - name: Generate coverage report
        run: npm run coverage

      - name: Generate menu gap report
        run: npm run menu-gaps

      - name: Validate data health
        run: npm run health

      - name: Validate season 10 profile parser
        run: npm run check:season10-profile

      - name: Validate competition rules
        run: npm run check:competition

      - name: Validate stats engine
        run: npm run check:stats

      - name: Print stats
        run: npm run stats

      - name: Refresh README snapshot
        run: npm run update:readme-stats

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "come-dine-stats bot"
          git config user.email "137178593+yossi-weinberger@users.noreply.github.com"

          for path in \
            README.md \
            data/raw/fandom/coverage.json \
            data/normalized/fandom-contestants.json \
            data/normalized/wikipedia-contestants.json \
            data/normalized/kan-episodes.json \
            data/normalized/kan-contestants.json \
            data/normalized/supplemental-menu-contestants.json \
            data/normalized/supplemental-profile-contestants.json \
            data/normalized/contestants.json \
            data/reports/wikipedia-import.json \
            data/reports/wikipedia-season10-rolling.json \
            data/reports/kan-contestant-enrichment.json \
            data/reports/kan-city-enrichment.json \
            data/reports/kan-recipe-import.json \
            data/reports/fandom-week-reconciliation.json \
            data/reports/conflicts.json \
            data/reports/refinements.json \
            data/reports/derived-placements.json \
            data/reports/coverage.json \
            data/reports/menu-gaps.json \
            data/reports/data-health.json
          do
            if [ -e "$path" ]; then git add "$path"; fi
          done

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "refresh imported show data"
          git push