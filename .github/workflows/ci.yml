name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Import official Kan recipes
        run: npm run import:kan-recipes

      - name: Refresh supplemental menus
        run: npm run import:supplemental-menus

      - name: Rebuild merged data with recipes
        run: |
          npm run merge
          npm run coverage
          npm run menu-gaps

      - name: Upload Kan recipe validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kan-recipe-validation
          path: |
            data/reports/kan-recipe-import.json
            data/reports/coverage.json
            data/reports/menu-gaps.json
            data/normalized/contestants.json
          if-no-files-found: error
          retention-days: 3

      - name: Data health
        run: npm run health

      - name: Competition rules
        run: npm run check:competition

      - name: Stats engine
        run: npm run check:stats

      - name: Build
        run: npm run build
